{% extends 'base.html' %}{% macro select(name,items,current,required=false) %}<select name="{{name}}" {%if required%}required{%endif%}><option value="">- Select -</option>{%for x in items%}<option value="{{x.id}}" {%if current==x.id%}selected{%endif%}>{{x.name}}</option>{%endfor%}</select>{%endmacro%}{% block content %}<div class="page-title"><div><h1>{{'Edit' if asset else 'Add'}} Asset</h1><p>Asset master details only. Assignment is a separate transaction.</p></div></div><form method="post" class="panel form-grid"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Asset Tag*<input name="asset_tag" required value="{{asset.asset_tag if asset else ''}}"></label><label>Category*{{select('category_id',categories,asset.category_id if asset else none,true)}}</label><label>Brand{{select('manufacturer_id',manufacturers,asset.manufacturer_id if asset else none)}}</label><label>Model<input name="model" value="{{asset.model if asset else ''}}"></label><label>Serial Number<input name="serial_number" value="{{asset.serial_number if asset else ''}}"></label><label>Vendor{{select('vendor_id',vendors,asset.vendor_id if asset else none)}}</label><label>Purchase Date<input type="date" name="purchase_date" value="{{asset.purchase_date if asset and asset.purchase_date else ''}}"></label><label>Purchase Cost<input type="number" min="0" step="0.01" name="purchase_cost" value="{{asset.purchase_cost if asset and asset.purchase_cost is not none else ''}}"></label><label>Warranty Expiry<input type="date" name="warranty_expiry" value="{{asset.warranty_expiry if asset and asset.warranty_expiry else ''}}"></label><label>Invoice Number<input name="invoice_number" value="{{asset.invoice_number if asset else ''}}"></label><label>Location{{select('location_id',locations,asset.location_id if asset else none)}}</label><label>Condition<input name="condition" value="{{asset.condition if asset else 'Good'}}"></label><label class="wide">Remarks<textarea name="remarks">{{asset.remarks if asset else ''}}</textarea></label>{%if asset%}<label class="wide">Reason for edit*<textarea name="reason" required></textarea></label>{%endif%}<div class="wide"><button>Save Asset</button> <a class="btn secondary" href="{{url_for('assets.list_assets')}}">Cancel</a></div></form>{% endblock %}
