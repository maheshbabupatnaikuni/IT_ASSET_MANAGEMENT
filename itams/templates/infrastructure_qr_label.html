<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{item.infrastructure_reference}} Label</title><style>*{box-sizing:border-box}body{font-family:Arial;margin:20px}.toolbar{margin-bottom:15px}.label{width:88mm;min-height:50mm;border:1px solid #222;border-radius:3mm;padding:4mm;display:grid;grid-template-columns:29mm 1fr;gap:4mm;align-items:center}.qr{width:28mm}.brand{color:#203f78;font-size:15px;font-weight:800;margin-bottom:2mm}.brand span{color:#1479b8}.ref{font-size:17px;font-weight:bold}.meta{font-size:11px;line-height:1.4;margin-top:2mm}@media print{body{margin:0}.toolbar{display:none}}@media(max-width:480px){.label{width:100%}}</style></head><body><div class="toolbar"><button onclick="window.print()">Open Print Preview</button> <button onclick="window.close()">Close</button></div><section class="label"><img class="qr" src="{{url_for('infrastructure.qr_image',reference=item.infrastructure_reference)}}" alt="QR"><div><div class="brand">RAY <span>IT</span> MANAGEMENT</div><div class="ref">{{item.infrastructure_reference}}</div><div class="meta"><b>Category:</b> {{item.category.name}}<br><b>Name:</b> {{item.display_name}}<br><b>Location:</b> {{item.company_location.name if item.company_location else '-'}} / {{item.floor or '-'}} / {{item.room or '-'}}<br><b>Serial:</b> {{item.serial_number or 'Not Available'}}</div></div></section></body></html>
