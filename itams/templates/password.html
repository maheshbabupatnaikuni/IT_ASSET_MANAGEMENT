{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>Change Password</h1>{%if session.must_change_password%}<p class="warning">You must change your temporary password before continuing.</p>{%endif%}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Current Password<input type="password" name="current_password" required></label><label>New Password<input type="password" name="new_password" minlength="8" required></label><label>Confirm New Password<input type="password" name="confirm_password" minlength="8" required></label><button>Update Password</button></form></section>{% endblock %}
