{% extends 'base.html' %}{% block content %}<div class="page-title"><div><h1>Reset All Imported Data</h1><p>Manually created records, users, settings, and audit history are preserved</p></div></div><div class="cards"><div class="card"><b>{{summary.batches}}</b><span>Batches</span></div><div class="card"><b>{{summary.assets}}</b><span>Linked Assets</span></div><div class="card"><b>{{summary.employees}}</b><span>Linked Employees</span></div><div class="card"><b>{{summary.dynamic}}</b><span>Dynamic Values</span></div></div><section class="panel narrow"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Current Super Admin password<input type="password" name="current_password" required></label><label>Type RESET ALL IMPORTED DATA<input name="confirmation" pattern="RESET ALL IMPORTED DATA" required></label><button class="danger" onclick="return confirm('Final confirmation: reset imported-source data?')">Reset Imported Data</button></form></section>{%endblock%}
